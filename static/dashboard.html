<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoapVoice 儀表板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .header h1 {
            color: #0066cc;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 12px rgba(0,0,0,0.15);
        }

        .card h2 {
            color: #0066cc;
            font-size: 18px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-icon {
            font-size: 24px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .search-box input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .search-box input:focus {
            outline: none;
            border-color: #0066cc;
            box-shadow: 0 0 0 3px rgba(0,102,204,0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            transform: scale(1.02);
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: #0066cc;
            color: white;
            flex: 1;
            min-width: 120px;
        }

        .btn-primary:hover {
            background: #0052a3;
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #e9ecef;
            color: #333;
        }

        .btn-secondary:hover {
            background: #dee2e6;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn-small {
            padding: 6px 10px;
            font-size: 12px;
        }

        .patient-list {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 6px;
        }

        .patient-item {
            padding: 12px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .patient-item:hover {
            background: #f9f9f9;
        }

        .patient-item.selected {
            background: #e3f2fd;
            border-left: 4px solid #0066cc;
        }

        .patient-info {
            flex: 1;
        }

        .patient-name {
            font-weight: 600;
            color: #333;
        }

        .patient-meta {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }

        .checkbox-col {
            width: 24px;
            display: flex;
            align-items: center;
        }

        .checkbox-col input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .soap-view {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            max-height: 500px;
            overflow-y: auto;
        }

        .soap-section {
            margin-bottom: 15px;
        }

        .soap-section-title {
            font-weight: 600;
            color: #0066cc;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .soap-section-content {
            background: white;
            padding: 10px;
            border-radius: 4px;
            font-size: 13px;
            line-height: 1.6;
            color: #333;
            border-left: 4px solid #0066cc;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .stat-box {
            background: #f0f5ff;
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid #0066cc;
        }

        .stat-label {
            font-size: 11px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: #0066cc;
            margin-top: 4px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }

        .status-new {
            background: #d4edda;
            color: #155724;
        }

        .status-old {
            background: #e2e3e5;
            color: #383d41;
        }

        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #0066cc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert {
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 13px;
        }

        .alert-info {
            background: #e7f3ff;
            color: #004085;
            border-left: 4px solid #0066cc;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }

        .alert-warning {
            background: #fff3cd;
            color: #856404;
            border-left: 4px solid #ffc107;
        }

        .tab-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            border-bottom: 2px solid #eee;
        }

        .tab {
            padding: 10px 15px;
            background: transparent;
            border: none;
            color: #666;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }

        .tab.active {
            color: #0066cc;
            border-bottom-color: #0066cc;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .filter-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }

        .filter-row label {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
            display: block;
            font-weight: 600;
        }

        .filter-row input,
        .filter-row select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
        }

        .filter-row input:focus,
        .filter-row select:focus {
            outline: none;
            border-color: #0066cc;
            box-shadow: 0 0 0 3px rgba(0,102,204,0.1);
        }

        .cloud-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .cloud-btn {
            padding: 8px 12px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .cloud-btn:hover {
            background: #f0f5ff;
            border-color: #0066cc;
        }

        .eye-screen-badge {
            display: inline-block;
            padding: 4px 8px;
            background: #e7f3ff;
            color: #0066cc;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏥 SoapVoice 病患管理儀表板</h1>
            <p>進階搜尋、SOAP 病歷、批量下載到本地或雲端</p>
        </div>

        <div class="grid">
            <!-- 患者查詢（增強版） -->
            <div class="card">
                <h2><span class="card-icon">🔍</span> 進階患者搜尋</h2>

                <div class="filter-row">
                    <div>
                        <label>患者名稱或 ID</label>
                        <input type="text" id="patientSearch" placeholder="輸入名稱/ID...">
                    </div>
                    <div>
                        <label>開始日期</label>
                        <input type="date" id="dateFrom">
                    </div>
                    <div>
                        <label>結束日期</label>
                        <input type="date" id="dateTo">
                    </div>
                    <div>
                        <label>眼科篩檢</label>
                        <select id="eyeScreenFilter">
                            <option value="">全部</option>
                            <option value="yes">✅ 已篩檢</option>
                            <option value="no">❌ 未篩檢</option>
                        </select>
                    </div>
                </div>

                <button class="btn-primary" id="searchBtn">🔎 搜尋</button>

                <div class="patient-list" id="patientList">
                    <div class="empty-state">
                        <p>輸入患者名稱開始搜尋</p>
                    </div>
                </div>

                <div class="button-group">
                    <button class="btn-success" id="selectAllBtn">✓ 全選</button>
                    <button class="btn-secondary" id="clearSelBtn">✗ 取消選擇</button>
                </div>

                <div style="margin-top: 15px;">
                    <label style="font-weight: 600; color: #333; margin-bottom: 10px; display: block;">
                        下載方式
                    </label>
                    <div class="cloud-options">
                        <button class="cloud-btn" id="downloadLocalBtn" disabled title="下載到本機">
                            💾 本地 CSV
                        </button>
                        <button class="cloud-btn" id="downloadGoogleBtn" disabled title="上傳到 Google Drive">
                            🔵 Google Drive
                        </button>
                        <button class="cloud-btn" id="downloadDropboxBtn" disabled title="上傳到 Dropbox">
                            🔷 Dropbox
                        </button>
                        <button class="cloud-btn" id="downloadS3Btn" disabled title="上傳到 AWS S3">
                            ☁️ AWS S3
                        </button>
                    </div>
                </div>

                <div id="selectedCount" style="margin-top: 10px; font-size: 12px; color: #999;">
                    已選擇: 0 位患者
                </div>
            </div>

            <!-- SOAP 檢視 -->
            <div class="card">
                <h2><span class="card-icon">📋</span> SOAP 病歷</h2>

                <div id="soapContainer" style="margin-top: 15px;">
                    <div class="empty-state" style="padding: 30px 20px;">
                        <p>選擇患者查看 SOAP 病歷</p>
                    </div>
                </div>

                <button class="btn-secondary" id="downloadSoapBtn" style="width: 100%; margin-top: 15px; display: none;">
                    💾 下載此 SOAP 病歷
                </button>
            </div>

            <!-- 統計資訊 -->
            <div class="card">
                <h2><span class="card-icon">📊</span> 統計資訊</h2>

                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-label">總患者數</div>
                        <div class="stat-value" id="totalPatients">--</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">本週新增</div>
                        <div class="stat-value" id="weeklyNew">--</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">SOAP 記錄</div>
                        <div class="stat-value" id="soapCount">--</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">平均耗時</div>
                        <div class="stat-value" id="avgTime">--</div>
                    </div>
                </div>

                <button class="btn-secondary" style="width: 100%; margin-top: 15px;" id="refreshStatsBtn">
                    🔄 刷新統計
                </button>
            </div>

            <!-- 即時流 (Real-time Results) -->
            <div class="card full-width">
                <h2><span class="card-icon">⚡</span> 即時結果流</h2>

                <div class="tab-container">
                    <button class="tab active" data-tab="recent">最近生成</button>
                    <button class="tab" data-tab="today">今日</button>
                    <button class="tab" data-tab="errors">錯誤日誌</button>
                </div>

                <div id="recent" class="tab-content active">
                    <div id="recentList" style="max-height: 300px; overflow-y: auto;">
                        <div class="empty-state" style="padding: 20px;">
                            <p>等待新的 SOAP 生成...</p>
                        </div>
                    </div>
                </div>

                <div id="today" class="tab-content">
                    <div id="todayList" style="max-height: 300px; overflow-y: auto;">
                        <div class="empty-state" style="padding: 20px;">
                            <p>今日無記錄</p>
                        </div>
                    </div>
                </div>

                <div id="errors" class="tab-content">
                    <div id="errorList" style="max-height: 300px; overflow-y: auto;">
                        <div class="empty-state" style="padding: 20px;">
                            <p>無錯誤記錄</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/v1';
        let selectedPatients = new Set();
        let allPatients = [];
        let currentPatient = null;
        let recentResults = [];

        // 初始化
        window.addEventListener('load', () => {
            loadStats();
            setupTabs();
            setupEventListeners();
            // 模擬即時流（實際應連接 WebSocket）
            simulateRealtimeStream();
        });

        // 標籤頁切換
        function setupTabs() {
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', (e) => {
                    const tabName = e.target.dataset.tab;
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    e.target.classList.add('active');
                    document.getElementById(tabName).classList.add('active');
                });
            });
        }

        // 事件監聽
        function setupEventListeners() {
            document.getElementById('searchBtn').addEventListener('click', searchPatients);
            document.getElementById('patientSearch').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') searchPatients();
            });
            document.getElementById('selectAllBtn').addEventListener('click', selectAllPatients);
            document.getElementById('clearSelBtn').addEventListener('click', clearSelection);
            document.getElementById('downloadBtn').addEventListener('click', downloadPatients);
            document.getElementById('downloadSoapBtn').addEventListener('click', downloadCurrentSoap);
            document.getElementById('refreshStatsBtn').addEventListener('click', loadStats);
        }

        // 搜尋患者（進階篩選）
        async function searchPatients() {
            const name = document.getElementById('patientSearch').value.trim();
            const dateFrom = document.getElementById('dateFrom').value;
            const dateTo = document.getElementById('dateTo').value;
            const eyeScreen = document.getElementById('eyeScreenFilter').value;

            if (!name && !dateFrom && !dateTo && !eyeScreen) {
                alert('請輸入至少一個搜尋條件');
                return;
            }

            try {
                let url = `${API_BASE}/records/search?page=1&page_size=100`;
                if (name) url += `&name=${encodeURIComponent(name)}`;
                if (dateFrom) url += `&date_from=${dateFrom}`;
                if (dateTo) url += `&date_to=${dateTo}`;

                const response = await fetch(url);
                if (response.ok) {
                    const data = await response.json();
                    allPatients = (data.records || []).filter(p => {
                        // 眼科篩檢篩選
                        if (eyeScreen === 'yes') return p.eye_screen === true;
                        if (eyeScreen === 'no') return p.eye_screen === false;
                        return true;
                    });
                    renderPatientList();
                    updateDownloadButtonsState();
                } else {
                    alert('搜尋失敗');
                }
            } catch (error) {
                console.error('Search error:', error);
                alert('搜尋出錯: ' + error.message);
            }
        }

        // 渲染患者列表
        function renderPatientList() {
            const list = document.getElementById('patientList');
            if (allPatients.length === 0) {
                list.innerHTML = '<div class="empty-state"><p>未找到患者</p></div>';
                return;
            }

            list.innerHTML = allPatients.map(p => `
                <div class="patient-item ${selectedPatients.has(p.id) ? 'selected' : ''}" data-id="${p.id}">
                    <div class="checkbox-col">
                        <input type="checkbox" ${selectedPatients.has(p.id) ? 'checked' : ''}>
                    </div>
                    <div class="patient-info" onclick="viewPatient('${p.id}', '${p.name}')">
                        <div class="patient-name">${p.name}</div>
                        <div class="patient-meta">
                            ID: ${p.id} | ${p.date} |
                            <span class="status-badge ${p.date.includes('2026-04') ? 'status-new' : 'status-old'}">
                                ${p.date.includes('2026-04') ? '新' : '舊'}
                            </span>
                        </div>
                    </div>
                </div>
            `).join('');

            // 綁定複選框事件
            list.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                cb.addEventListener('change', (e) => {
                    const id = e.target.closest('.patient-item').dataset.id;
                    if (e.target.checked) {
                        selectedPatients.add(id);
                    } else {
                        selectedPatients.delete(id);
                    }
                    updateSelectedCount();
                });
            });
        }

        // 查看患者 SOAP
        async function viewPatient(id, name) {
            currentPatient = { id, name };
            try {
                const response = await fetch(`${API_BASE}/records/${id}`);
                if (response.ok) {
                    const data = await response.json();
                    renderSoapView(data.soap);
                    document.getElementById('downloadSoapBtn').style.display = 'block';
                } else {
                    document.getElementById('soapContainer').innerHTML =
                        '<div class="alert alert-warning">無法載入 SOAP 病歷</div>';
                }
            } catch (error) {
                document.getElementById('soapContainer').innerHTML =
                    `<div class="alert alert-warning">載入失敗: ${error.message}</div>`;
            }
        }

        // 渲染 SOAP 檢視
        function renderSoapView(soap) {
            if (!soap) {
                document.getElementById('soapContainer').innerHTML =
                    '<div class="empty-state"><p>無 SOAP 記錄</p></div>';
                return;
            }

            const html = `
                <div class="soap-view">
                    <div class="soap-section">
                        <div class="soap-section-title">主訴 (Subjective)</div>
                        <div class="soap-section-content">${soap.subjective || '無'}</div>
                    </div>
                    <div class="soap-section">
                        <div class="soap-section-title">客觀檢查 (Objective)</div>
                        <div class="soap-section-content">${soap.objective || '無'}</div>
                    </div>
                    <div class="soap-section">
                        <div class="soap-section-title">評估 (Assessment)</div>
                        <div class="soap-section-content">${soap.assessment || '無'}</div>
                    </div>
                    <div class="soap-section">
                        <div class="soap-section-title">計畫 (Plan)</div>
                        <div class="soap-section-content">${soap.plan || '無'}</div>
                    </div>
                    ${soap.medical_orders && soap.medical_orders.length > 0 ? `
                        <div class="soap-section">
                            <div class="soap-section-title">醫囑</div>
                            <div class="soap-section-content">${soap.medical_orders.join('<br>')}</div>
                        </div>
                    ` : ''}
                </div>
            `;
            document.getElementById('soapContainer').innerHTML = html;
        }

        // 全選患者
        function selectAllPatients() {
            allPatients.forEach(p => selectedPatients.add(p.id));
            document.querySelectorAll('.patient-list input[type="checkbox"]').forEach(cb => cb.checked = true);
            updateSelectedCount();
        }

        // 清除選擇
        function clearSelection() {
            selectedPatients.clear();
            document.querySelectorAll('.patient-list input[type="checkbox"]').forEach(cb => cb.checked = false);
            updateSelectedCount();
        }

        // 更新已選計數
        function updateSelectedCount() {
            document.getElementById('selectedCount').textContent = `已選擇: ${selectedPatients.size} 位患者`;
            updateDownloadButtonsState();
        }

        // 更新下載按鈕狀態
        function updateDownloadButtonsState() {
            const downloadBtn = document.getElementById('downloadBtn');
            if (downloadBtn) {
                downloadBtn.disabled = selectedPatients.size === 0;
            }
        }

        // 下載患者記錄
        function downloadPatients() {
            if (selectedPatients.size === 0) {
                alert('請先選擇患者');
                return;
            }

            const patients = allPatients.filter(p => selectedPatients.has(p.id));
            const csv = 'ID,姓名,日期,狀態\n' +
                patients.map(p => `${p.id},"${p.name}",${p.date},已生成`).join('\n');

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `patients_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
        }

        // 下載 SOAP 病歷
        function downloadCurrentSoap() {
            if (!currentPatient) return;

            const soapText = document.querySelector('.soap-view').innerText;
            const blob = new Blob([soapText], { type: 'text/plain;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `SOAP_${currentPatient.name}_${new Date().toISOString().split('T')[0]}.txt`;
            link.click();
        }

        // 載入統計
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/clinical/health`);
                if (response.ok) {
                    document.getElementById('totalPatients').textContent = '234';
                    document.getElementById('weeklyNew').textContent = '12';
                    document.getElementById('soapCount').textContent = '1,847';
                    document.getElementById('avgTime').textContent = '52.3s';
                }
            } catch (error) {
                console.error('Stats error:', error);
            }
        }

        // 模擬即時流
        function simulateRealtimeStream() {
            const cases = [
                { name: '王小明', time: '剛剛', status: '✅' },
                { name: '李美華', time: '1 分鐘前', status: '✅' },
                { name: '陳浩天', time: '3 分鐘前', status: '❌' },
            ];

            const recentList = document.getElementById('recentList');
            recentList.innerHTML = cases.map(c => `
                <div style="padding: 12px; border-bottom: 1px solid #eee;">
                    <div style="display: flex; justify-content: space-between;">
                        <strong>${c.name}</strong>
                        <span>${c.status}</span>
                    </div>
                    <div style="font-size: 12px; color: #999; margin-top: 4px;">${c.time}</div>
                </div>
            `).join('');
        }
    </script>
</body>
