<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoapVoice 監控儀表板</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            color: #333;
        }

        /* ── 頁首 ─────────────────────────────────────── */
        .header {
            background: linear-gradient(135deg, #0066cc 0%, #004499 100%);
            color: white;
            padding: 20px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .header-left h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .header-left p {
            font-size: 13px;
            opacity: 0.85;
        }

        .header-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }

        /* ── 連線狀態指示器 ──────────────────────────── */
        .connection-status {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.15);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
        }

        .connection-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ccc;
            flex-shrink: 0;
            transition: background 0.3s;
        }

        .connection-dot.connected {
            background: #28d17c;
            animation: pulse-green 2s infinite;
        }

        .connection-dot.disconnected {
            background: #ff4d4d;
            animation: pulse-red 1s infinite;
        }

        .connection-dot.connecting {
            background: #ffc107;
        }

        @keyframes pulse-green {
            0%, 100% { box-shadow: 0 0 0 0 rgba(40,209,124,0.4); }
            50% { box-shadow: 0 0 0 5px rgba(40,209,124,0); }
        }

        @keyframes pulse-red {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,77,77,0.5); }
            50% { box-shadow: 0 0 0 5px rgba(255,77,77,0); }
        }

        #connectionIndicator {
            font-weight: 600;
        }

        #lastUpdateTime {
            font-size: 12px;
            opacity: 0.8;
        }

        /* ── 主容器 ──────────────────────────────────── */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px 20px;
        }

        /* ── 章節標題 ────────────────────────────────── */
        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: #444;
            margin-bottom: 14px;
            padding-left: 10px;
            border-left: 4px solid #0066cc;
        }

        /* ── 指標卡片區 ──────────────────────────────── */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 18px;
            margin-bottom: 28px;
        }

        .metric-card {
            background: white;
            border-radius: 12px;
            padding: 22px 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }

        .metric-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
        }

        .metric-card.gpu::before { background: #0066cc; }
        .metric-card.vram::before { background: #6f42c1; }
        .metric-card.queue::before { background: #17a2b8; }

        .metric-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.12);
        }

        .metric-card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .metric-icon {
            font-size: 26px;
            line-height: 1;
        }

        .metric-label {
            font-size: 14px;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .metric-value {
            font-size: 40px;
            font-weight: 800;
            color: #222;
            line-height: 1;
            margin-bottom: 8px;
            font-variant-numeric: tabular-nums;
        }

        .metric-value span.unit {
            font-size: 18px;
            font-weight: 500;
            color: #888;
            margin-left: 4px;
        }

        .metric-sub {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }

        /* VRAM 進度條 */
        .vram-bar-container {
            margin-top: 12px;
        }

        .vram-bar-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
        }

        .vram-bar {
            width: 100%;
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
        }

        .vram-bar-fill {
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, #6f42c1, #a855f7);
            transition: width 0.5s ease;
            width: 0%;
        }

        /* ── 圖表區 ───────────────────────────────────── */
        .chart-section {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 28px;
        }

        .chart-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .granularity-selector {
            display: flex;
            gap: 6px;
        }

        .granularity-btn {
            padding: 6px 16px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            color: #555;
        }

        .granularity-btn.active,
        .granularity-btn:hover {
            background: #0066cc;
            border-color: #0066cc;
            color: white;
        }

        .chart-wrapper {
            position: relative;
            height: 280px;
        }

        /* ── 統計卡片區 ──────────────────────────────── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 18px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 22px 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .stat-icon-box {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            flex-shrink: 0;
        }

        .stat-icon-box.today { background: #e8f4fd; }
        .stat-icon-box.monthly { background: #f0ebff; }

        .stat-info {}

        .stat-card-label {
            font-size: 13px;
            color: #888;
            margin-bottom: 4px;
        }

        .stat-card-value {
            font-size: 32px;
            font-weight: 800;
            color: #222;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }

        .stat-card-sub {
            font-size: 11px;
            color: #bbb;
            margin-top: 4px;
        }

        /* ── 頁尾 ─────────────────────────────────────── */
        .footer {
            background: #fff;
            border-top: 1px solid #eee;
            padding: 16px 30px;
            text-align: center;
            font-size: 12px;
            color: #aaa;
        }

        /* ── 錯誤通知列 ─────────────────────────────── */
        .alert-bar {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            color: #856404;
            padding: 10px 16px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 13px;
            display: none;
        }

        .alert-bar.show { display: block; }

        /* ── 響應式 ──────────────────────────────────── */
        @media (max-width: 600px) {
            .header { flex-direction: column; align-items: flex-start; gap: 12px; }
            .header-right { align-items: flex-start; }
            .metric-value { font-size: 32px; }
        }
    </style>
</head>
<body>

    <!-- 頁首 -->
    <header class="header" role="banner">
        <div class="header-left">
            <h1>SoapVoice 監控儀表板</h1>
            <p>GPU 伺服器即時健康狀態 &amp; 歷史趨勢</p>
        </div>
        <div class="header-right">
            <!-- 連線狀態指示器 -->
            <div class="connection-status" role="status" aria-live="polite">
                <div class="connection-dot connecting" id="connectionDot"></div>
                <span id="connectionIndicator">連線中...</span>
            </div>
            <!-- 最後更新時間 -->
            <span id="lastUpdateTime">尚未接收資料</span>
        </div>
    </header>

    <main class="container">

        <!-- 錯誤通知列 -->
        <div class="alert-bar" id="alertBar" role="alert"></div>

        <!-- ── 即時警報區 (Phase 12-03) ─────────────── -->
        <section aria-labelledby="alertSectionTitle">
            <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
                <h2 class="section-title" id="alertSectionTitle" style="margin-bottom:0; border:none; padding:0;">即時警報</h2>
                <button id="alert-sound-toggle"
                    onclick="setAlertSoundEnabled(!alertState.alertSoundEnabled)"
                    title="點擊切換聲音通知">🔔 聲音</button>
            </div>
            <div class="alert-container" id="alert-container">
                <div class="alert-empty">目前無活躍警報</div>
            </div>
        </section>

        <!-- ── 即時指標卡片 ─────────────────────────── -->
        <section aria-labelledby="metricsTitle">
            <h2 class="section-title" id="metricsTitle">即時系統指標</h2>
            <div class="metrics-grid">

                <!-- GPU 使用率 -->
                <article class="metric-card gpu" aria-label="GPU 使用率">
                    <div class="metric-card-header">
                        <span class="metric-icon">&#x1F4CA;</span>
                        <span class="metric-label">GPU 使用率</span>
                    </div>
                    <div class="metric-value" id="gpuPercent">
                        --<span class="unit">%</span>
                    </div>
                    <div class="metric-sub" id="gpuSub">等待資料中...</div>
                </article>

                <!-- VRAM 使用量 -->
                <article class="metric-card vram" aria-label="VRAM 使用量">
                    <div class="metric-card-header">
                        <span class="metric-icon">&#x1F9E0;</span>
                        <span class="metric-label">VRAM 使用量</span>
                    </div>
                    <div class="metric-value" id="vramMb">
                        --<span class="unit">MB</span>
                    </div>
                    <div class="vram-bar-container">
                        <div class="vram-bar-label">
                            <span>已用</span>
                            <span id="vramTotal">/ -- MB</span>
                        </div>
                        <div class="vram-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                            <div class="vram-bar-fill" id="vramBarFill"></div>
                        </div>
                    </div>
                </article>

                <!-- 佇列長度 -->
                <article class="metric-card queue" aria-label="處理佇列長度">
                    <div class="metric-card-header">
                        <span class="metric-icon">&#x23F3;</span>
                        <span class="metric-label">處理佇列長度</span>
                    </div>
                    <div class="metric-value" id="queueLength">
                        --<span class="unit">筆</span>
                    </div>
                    <div class="metric-sub" id="queueSub">等待資料中...</div>
                </article>

            </div>
        </section>

        <!-- ── 歷史趨勢圖 ──────────────────────────── -->
        <section class="chart-section" aria-labelledby="chartTitle">
            <div class="chart-controls">
                <h2 class="section-title" id="chartTitle" style="margin-bottom:0; border:none; padding:0;">
                    歷史處理趨勢
                </h2>
                <!-- 粒度選擇器 -->
                <div class="granularity-selector" role="group" aria-label="圖表粒度">
                    <button class="granularity-btn active" data-granularity="hour" id="btnHour">
                        小時
                    </button>
                    <button class="granularity-btn" data-granularity="day" id="btnDay">
                        日
                    </button>
                </div>
            </div>
            <!-- Chart.js Canvas -->
            <div class="chart-wrapper">
                <canvas id="metricsChart" aria-label="GPU 使用率歷史折線圖" role="img"></canvas>
            </div>
        </section>

        <!-- ── 看診統計 ────────────────────────────── -->
        <section aria-labelledby="statsTitle">
            <h2 class="section-title" id="statsTitle">看診次數統計</h2>
            <div class="stats-grid">

                <!-- 本日看診 -->
                <div class="stat-card">
                    <div class="stat-icon-box today">&#x1F4C5;</div>
                    <div class="stat-info">
                        <div class="stat-card-label">本日看診次數</div>
                        <div class="stat-card-value" id="todayCount">--</div>
                        <div class="stat-card-sub" id="todayDate">載入中...</div>
                    </div>
                </div>

                <!-- 本月看診 -->
                <div class="stat-card">
                    <div class="stat-icon-box monthly">&#x1F4C6;</div>
                    <div class="stat-info">
                        <div class="stat-card-label">本月看診次數</div>
                        <div class="stat-card-value" id="monthlyCount">--</div>
                        <div class="stat-card-sub" id="monthlyRange">載入中...</div>
                    </div>
                </div>

            </div>
        </section>

    </main>

    <!-- 頁尾 -->
    <footer class="footer" role="contentinfo">
        <p>SoapVoice 監控儀表板 &mdash; 本頁資料僅供 IT 人員系統維護參考，不作為臨床診斷依據。</p>
        <p style="margin-top:4px;">資料每 2 秒自動更新 &bull; 使用 EventSource (SSE) 即時推送</p>
    </footer>

    <!-- 主要 JavaScript -->
    <script src="/static/js/dashboard.js"></script>
    <!-- Phase 12-03：即時警報系統 -->
    <script src="/static/js/dashboard-alerts.js"></script>

</body>
</html>
