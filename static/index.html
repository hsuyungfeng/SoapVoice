<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoapVoice - 醫療 SOAP 病歷系統</title>
    <meta http-equiv="refresh" content="30">
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { max-width: 900px; margin: 0 auto; padding: 20px; background: #0f0f23; color: #eee; }
        h1 { text-align: center; color: #00d9ff; margin-bottom: 15px; font-size: 1.8em; }
        
        .status { color: #00ff88; font-size: 12px; margin-bottom: 15px; }
        
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #888; font-size: 14px; }
        
        select {
            width: 100%; padding: 12px; margin-bottom: 10px;
            border: 1px solid #333; border-radius: 8px;
            background: #1a1a3e; color: #fff; font-size: 14px;
        }
        
        .btn-row { display: flex; gap: 10px; margin-bottom: 10px; }
        
        .record-btn {
            flex: 1; padding: 20px; 
            background: #ff4757;
            border: none; border-radius: 12px; color: #fff;
            font-size: 18px; font-weight: bold; cursor: pointer;
            transition: all 0.3s;
        }
        .record-btn:hover { background: #ff6b7a; }
        .record-btn.recording { background: #ff0000; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        
        .process-btn {
            flex: 1; padding: 20px; 
            background: #00d9ff;
            border: none; border-radius: 12px; color: #0f0f23;
            font-size: 18px; font-weight: bold; cursor: pointer;
        }
        .process-btn:hover { background: #00a8cc; }
        .process-btn:disabled { background: #555; cursor: not-allowed; }
        
        textarea { 
            width: 100%; height: 100px; padding: 12px; 
            border: 1px solid #333; border-radius: 8px; 
            background: #1a1a3e; color: #fff; font-size: 14px;
        }
        
        .result { margin-top: 20px; }
        
        .stats { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        .stat { 
            padding: 8px 12px; background: #1a1a3e; 
            border-radius: 8px; font-size: 12px; color: #00d9ff;
        }
        
        .section { margin-bottom: 12px; padding: 12px; background: #1a1a3e; border-radius: 8px; }
        .section-title { color: #00d9ff; font-weight: bold; margin-bottom: 8px; font-size: 14px; }
        
        .tags { display: flex; flex-wrap: wrap; gap: 5px; }
        .tag {
            padding: 4px 10px; background: #2d2d5a;
            border-radius: 15px; font-size: 12px; color: #aaa;
        }
        
        .soap-note { background: #16213e; padding: 15px; border-radius: 8px; border: 1px solid #333; }
        .soap-note h4 { color: #00d9ff; margin: 10px 0 5px 0; font-size: 13px; }
        .soap-note p { margin: 0; color: #ccc; font-size: 12px; line-height: 1.5; white-space: pre-wrap; }
        
        .loading { text-align: center; color: #00d9ff; padding: 15px; }
        .error { color: #ff6b6b; padding: 12px; background: #2d1b1b; border-radius: 8px; }
        
        .auto-refresh { position: fixed; top: 10px; right: 10px; background: #1a1a3e; padding: 5px 10px; border-radius: 5px; font-size: 11px; color: #00ff88; }
        
        .recording-indicator { display: none; text-align: center; padding: 10px; background: #ff4757; border-radius: 8px; margin-bottom: 10px; color: #fff; font-weight: bold; }
        .recording-indicator.active { display: block; }
        
        .audio-status { text-align: center; padding: 8px; color: #888; font-size: 12px; margin-bottom: 5px; }
        
        .test-audio { margin-top: 30px; padding-top: 20px; border-top: 1px solid #333; }
        .test-audio h3 { color: #00d9ff; text-align: center; margin-bottom: 15px; font-size: 16px; }
        .test-btn-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .test-btn {
            padding: 15px 20px; background: #2d2d5a;
            border: none; border-radius: 10px; color: #aaa;
            font-size: 14px; cursor: pointer; transition: all 0.3s;
        }
        .test-btn:hover { background: #3d3d7a; color: #fff; }
        .test-btn.processing { background: #00d9ff; color: #0f0f23; }
    </style>
</head>
<body>
    <div class="auto-refresh">⏱️ Auto: 30s</div>
    
    <h1>🩺 SoapVoice</h1>
    <div class="status">🟢 Online | Port: 8010</div>
    
    <div class="input-group">
        <label>🤖 模型選擇:</label>
        <select id="modelSelect">
            <option value="qwen2.5:3b">qwen2.5:3b (快速)</option>
            <option value="qwen2.5:7b">qwen2.5:7b (完整)</option>
        </select>
        
        <div class="recording-indicator" id="recordingIndicator">🔴 錄音中... 點擊停止</div>
        
        <div class="btn-row">
            <button class="record-btn" id="recordBtn" onmousedown="startRecording()" onmouseup="stopRecording()" ontouchstart="startRecording()" ontouchend="stopRecording()">🎤 開始錄音</button>
            <button class="process-btn" id="processBtn" onclick="processText()">處理完成！</button>
        </div>
        
        <div class="audio-status" id="audioStatus">按住「開始錄音」按鈕說話</div>
        
        <textarea id="inputText" placeholder="錄音完成後會自動顯示文字，或手動輸入對話文字..."></textarea>
    </div>
    
    <div id="result" class="result" style="display: none;"></div>
    
    <!-- 測試音檔區塊 -->
    <div class="test-audio">
        <h3>📁 測試音檔 (點擊自動處理)</h3>
        <div class="test-btn-row">
            <button class="test-btn" onclick="runTestPipeline('static/hypertension.wav', this)">高血壓</button>
            <button class="test-btn" onclick="runTestPipeline('static/chest_pain.wav', this)">胸痛</button>
            <button class="test-btn" onclick="runTestPipeline('static/diabetes.wav', this)">糖尿病</button>
            <button class="test-btn" onclick="runTestPipeline('static/wound_care.wav', this)">傷口護理</button>
            <button class="test-btn" onclick="runTestPipeline('static/respiratory.wav', this)">呼吸道</button>
            <button class="test-btn" onclick="runTestPipeline('static/drug_order.wav', this)">醫囑</button>
            <button class="test-btn" onclick="runTestPipeline('static/surgery_record.wav', this)">手術記錄</button>
            <button class="test-btn" onclick="runTestPipeline('static/doctor_patient.wav', this)">醫病對話</button>
        </div>
    </div>
    
    <script>
        const API_URL = 'http://' + window.location.host;
        let mediaRecorder = null;
        let audioChunks = [];
        
        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                
                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };
                
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    await transcribeAudio(audioBlob);
                    stream.getTracks().forEach(track => track.stop());
                };
                
                mediaRecorder.start();
                document.getElementById('recordBtn').textContent = '⏹️ 停止錄音';
                document.getElementById('recordBtn').classList.add('recording');
                document.getElementById('recordingIndicator').classList.add('active');
                document.getElementById('audioStatus').textContent = '錄音中...';
                
            } catch (err) {
                alert('無法訪問麥克風: ' + err.message);
            }
        }
        
        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                document.getElementById('recordBtn').textContent = '🎤 開始錄音';
                document.getElementById('recordBtn').classList.remove('recording');
                document.getElementById('recordingIndicator').classList.remove('active');
                document.getElementById('audioStatus').textContent = '處理中...';
            }
        }
        
        async function transcribeAudio(audioBlob) {
            const formData = new FormData();
            formData.append('audio', audioBlob, 'recording.wav');
            
            document.getElementById('audioStatus').textContent = '語音辨識中...';
            
            try {
                const response = await fetch(API_URL + '/api/v1/extended/transcribe', {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) throw new Error('轉錄失敗');
                
                const data = await response.json();
                document.getElementById('inputText').value = data.transcript || '';
                document.getElementById('audioStatus').textContent = '轉錄完成！點擊「處理完成」生成 SOAP';
                
            } catch (err) {
                document.getElementById('audioStatus').textContent = '轉錄錯誤: ' + err.message;
            }
        }
        
        async function runTestPipeline(filename, btn) {
            const model = document.getElementById('modelSelect').value;
            const resultDiv = document.getElementById('result');
            
            // 顯示 loading
            btn.classList.add('processing');
            btn.textContent = '處理中...';
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<div class="loading">處理中: ' + filename + '</div>';
            
            try {
                // 1. 上傳音檔轉錄
                const audioResponse = await fetch(filename);
                const audioBlob = await audioResponse.blob();
                
                const formData = new FormData();
                formData.append('audio', audioBlob, filename.split('/').pop());
                
                const transcribeRes = await fetch(API_URL + '/api/v1/extended/transcribe', {
                    method: 'POST',
                    body: formData
                });
                
                if (!transcribeRes.ok) throw new Error('轉錄失敗');
                
                const transcribeData = await transcribeRes.json();
                const transcript = transcribeData.transcript;
                document.getElementById('inputText').value = transcript;
                
                // 2. 處理 SOAP
                const processRes = await fetch(API_URL + '/api/v1/extended/process', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        transcript: transcript, 
                        model: model,
                        include_symptoms: true,
                        include_icd10: true,
                        include_orders: true,
                        include_drugs: true
                    })
                });
                
                if (!processRes.ok) throw new Error('處理失敗');
                
                const processData = await processRes.json();
                displayResult(processData, transcript);
                
            } catch (err) {
                resultDiv.innerHTML = '<div class="error">錯誤: ' + err.message + '</div>';
            } finally {
                btn.classList.remove('processing');
                btn.textContent = filename.split('/').pop().replace('.wav', '');
            }
        }
        
        async function processText() {
            const input = document.getElementById('inputText').value.trim();
            const model = document.getElementById('modelSelect').value;
            const resultDiv = document.getElementById('result');
            const processBtn = document.getElementById('processBtn');
            
            if (!input) {
                alert('請先錄音或輸入對話文字');
                return;
            }
            
            processBtn.disabled = true;
            processBtn.textContent = '處理中...';
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<div class="loading">處理中...</div>';
            
            try {
                const response = await fetch(API_URL + '/api/v1/extended/process', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        transcript: input, 
                        model: model,
                        include_symptoms: true,
                        include_icd10: true,
                        include_orders: true,
                        include_drugs: true
                    })
                });
                
                if (!response.ok) throw new Error('API請求失敗');
                
                const data = await response.json();
                displayResult(data, input);
                
            } catch (error) {
                resultDiv.innerHTML = '<div class="error">錯誤: ' + error.message + '</div>';
            } finally {
                processBtn.disabled = false;
                processBtn.textContent = '處理完成！';
            }
        }
        
        function displayResult(data, input) {
            const ext = data;
            const soap = ext.soap || {};
            
            let subjective = '', objective = '', assessment = '', plan = '';
            if (typeof soap === 'string') {
                const sections = soap.split('\n');
                let current = '';
                for (const line of sections) {
                    if (line.match(/S\s*[-–]\s*|Subjective/i)) current = 'subjective';
                    else if (line.match(/O\s*[-–]\s*|Objective/i)) current = 'objective';
                    else if (line.match(/A\s*[-–]\s*|Assessment/i)) current = 'assessment';
                    else if (line.match(/P\s*[-–]\s*|Plan/i)) current = 'plan';
                    else if (current && line.trim()) {
                        if (current === 'subjective') subjective += line + '\n';
                        else if (current === 'objective') objective += line + '\n';
                        else if (current === 'assessment') assessment += line + '\n';
                        else if (current === 'plan') plan += line + '\n';
                    }
                }
            } else {
                subjective = soap.subjective || '';
                objective = soap.objective || '';
                assessment = soap.assessment || '';
                plan = soap.plan || '';
            }
            
            const processingTime = ext.processing_time || 0;
            
            let html = `
                <div class="stats">
                    <div class="stat">⏱️ 處理: ${processingTime.toFixed(2)}秒</div>
                    <div class="stat">📝 字數: ${input.length}</div>
                </div>
            `;
            
            if (ext.symptoms && ext.symptoms.length > 0) {
                html += `<div class="section"><div class="section-title">📋 症狀</div><div class="tags">${ext.symptoms.map(s => `<span class="tag">${s}</span>`).join('')}</div></div>`;
            }
            
            if (ext.icd10_codes && ext.icd10_codes.length > 0) {
                html += `<div class="section"><div class="section-title">🏥 ICD-10</div><div class="tags">${ext.icd10_codes.map(i => `<span class="tag">${i.code} - ${i.description}</span>`).join('')}</div></div>`;
            }
            
            html += `
                <div class="soap-note">
                    <div class="section-title">📄 SOAP 病歷</div>
                    <h4>S - Subjective:</h4><p>${subjective || '(無)'}</p>
                    <h4>O - Objective:</h4><p>${objective || '(無)'}</p>
                    <h4>A - Assessment:</h4><p>${assessment || '(無)'}</p>
                    <h4>P - Plan:</h4><p>${plan || '(無)'}</p>
                </div>
            `;
            
            document.getElementById('result').innerHTML = html;
        }
        
        // Auto-refresh
        setTimeout(() => window.location.reload(), 30000);
    </script>
</body>
</html>
