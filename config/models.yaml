# Model Configuration
# AI 模型配置文件

whisper:
  # Faster-Whisper 模型配置
  model_id: "medium"
  device: "cuda"
  compute_type: "float16"
  language: "auto"  # 自動偵測語言
  task: "transcribe"
  beam_size: 5
  vad_filter: true

  # 下載配置
  download_root: null  # 使用預設路徑 ~/.cache/huggingface/hub

  # 支援的語言
  supported_languages:
    - "en"  # English
    - "zh"  # Chinese
    - "ja"  # Japanese
    - "ko"  # Korean
    - "es"  # Spanish
    - "fr"  # French
    - "de"  # German

ocr:
  # OCR 引擎配置
  primary_engine: "tesseract"  # 主力引擎：Tesseract-OCR（離線，輕量）
  fallback_engines:
    - "vision"  # 備用：Ollama Vision (glm-ocr)
    - "easyocr"  # 備用：EasyOCR（需 PyTorch CUDA）

  # Tesseract 配置
  tesseract:
    languages: "chi_tra+eng"  # 繁體中文 + 英文
    config: ""  # 額外 Tesseract 參數（可選）

  # Ollama Vision 配置
  ollama_vision:
    model: "glm-ocr"  # 預設視覺模型
    fallback_models:
      - "gemma4:e4b"
      - "gemma4:e2b"
      - "qwen3-vl:4b"
    api_base: "http://localhost:11434"

  # EasyOCR 配置（備用）
  easyocr:
    languages:
      - "ch_tra"  # 繁體中文
      - "en"      # 英文
    gpu: false  # CPU 推理

llm:
  # LLM 模型配置 (Ollama 本地部署)
  provider: "ollama"
  model: "qwen3.5:9b"  # 主模型：Qwen3.5 9B（輕量）
  api_base: "http://localhost:11434"  # Ollama 服務
  temperature: 0.3
  max_tokens: 1024

  # 備用模型配置
  fallback_models:
    - "qwen3.5:27b"  # 備用較大版本
    - "glm-4.7-flash:latest"  # 快速推理模型

  # Ollama 配置
  ollama:
    num_ctx: 4096
    num_gpu: 1
    num_thread: 16

# GPU 配置
gpu:
  asr_device: "cuda:1"  # Whisper 使用 GPU1
  llm_device: "cuda:0"  # LLM 使用 GPU0

# 效能目標
performance:
  asr_max_latency_ms: 500  # ASR 延遲目標 < 500ms
  llm_max_latency_ms: 1000  # LLM 延遲目標 < 1s
